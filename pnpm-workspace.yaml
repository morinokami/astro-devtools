  "@playwright/test": 1.63.0
  "@tailwindcss/postcss": 4.3.3
  "@types/alpinejs": 3.13.11
  "@types/node": 26.6.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/browser-playwright": 4.1.11
  alpinejs: 3.17.3
  astro: 7.3.2
  class-variance-authority: 0.7.1
  cn: 0.3.0
  devalue: 5.9.2
  es-module-lexer: 3.0.2
  happy-dom: 20.14.5
  knip: 6.35.1
  magic-string: 1.4.1
  pkg-pr-new: 0.0.88
  playwright: 1.63.0
  postcss: 8.5.28
  preact: 10.29.8
  react: 19.3.0
  react-dom: 19.3.0
  solid-js: 1.9.15
  svelte: 5.57.0
  tailwindcss: 4.3.3
  publint: 0.3.24
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  vitest: 4.1.11
  vue: 3.5.42

catalogs:
  devtools:
    "@devframes/agentic": 1.0.0
    "@devframes/vite": 1.0.0
    "@vitejs/devtools": 0.7.5
    "@vitejs/devtools-kit": 0.7.5
    "@vitejs/devtools-oxc": 0.7.5
    "@vitejs/devtools-rolldown": 0.7.5
    "@vitejs/devtools-vite": 0.7.5
    "@vitejs/devtools-vitest": 0.7.5
    devframe: 1.0.0
  storybook:
    "@storybook/addon-a11y": 10.6.0
    "@storybook/addon-themes": 10.6.0
    "@storybook/addon-vitest": 10.6.0
    "@storybook/preact-vite": 10.6.0
    storybook: 10.6.0

allowBuilds:
  esbuild: true

minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  # Inspector requires chokidar 4.x; 4.0.3 was published without provenance.
  # Upstream tracks this known metadata gap: https://github.com/paulmillr/chokidar/issues/1440
  - chokidar@4.0.3
  # Inspector requires pino 9.x. All 207 published files match the official
  # v9.14.0 tag; this maintainer-published release lacks provenance.
  # https://github.com/pinojs/pino/releases/tag/v9.14.0
  - pino@9.14.0
  # The 2023 ReDoS backport for the 6.x line, published (signed, no
  # provenance) after the 7.x line had begun publishing with provenance —
  # a verified-benign downgrade, pinned so other semver versions stay covered.
  - semver@6.3.1

peerDependencyRules:
  # `vp migrate` adds one entry per override it manages (below). `vite` is the
  # one that matters: aliased to vite-plus-core, whose 0.x version satisfies
  # no upstream vite peer range. `vitest` is pinned, not aliased, and meets
  # its dependents' ranges as long as the pinned version does.
  allowAny:
    - vite
    - vitest
# The Vite+ single-instance contract, maintained by `vp migrate`: `vite` is
# aliased to vite-plus-core across the entire tree (astro's own vite
# dependency included), and `vitest` is pinned to the version Vite+ bundles so
# every package shares one copy with `vp test`.
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
